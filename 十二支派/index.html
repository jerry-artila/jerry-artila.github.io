                fullDetail: "拉結所生長子，雅各晚年最寵愛的兒子。因蒙受彩衣與異象招致兄長嫉妒，被賣至埃及為奴，經歷誣陷下獄，後解法老之夢被擢升為埃及全地宰相。在大饑荒中以智慧積糧，解救全家族性命並促成兄弟和解。雅各給予他長子的雙倍產業份額，由其兩個兒子「以法蓮」與「瑪拿西」分別立為兩個獨立支派。"
            },
            {
                id: 12,
                name: "便雅憫",
                mother: "拉結",
                motherBadge: "bg-rose-100 text-rose-950 border-rose-400",
                role: "撕掠之狼 / 王國正統",
                descendants: "掃羅王（首任君王）、使徒保羅（新約）",
                blessing: "雅各預言：「便雅憫是個撕掠的狼，早晨要吃他所抓的，晚上要分他所奪的」。",
                territoryNote: "位於猶大與以法蓮之間的戰略要衝，包含耶路撒冷邊界。",
                summary: "雅各幼子，拉結難產所生。後代驍勇擅甩石，以色列首任君王掃羅與使徒保羅皆出自此支派。",
                fullDetail: "雅各最小的兒子，拉結在伯利恆路旁難產時所生。拉結臨終前為他起名「便俄尼」（受苦之子），雅各改為「便雅憫」（右手之子）。其支派驍勇善戰，善用左手甩石。以色列歷史上的第一位君王掃羅王，以及新約使徒保羅，皆出自便雅憫支派。南國猶大分裂後，便雅憫支派始終與猶大支派站在一起，維持大衛王朝的正統。"
            }
        ];

        let currentMotherFilter = "all";

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            renderSonsCards();
            setupEventListeners();
        });

        // 渲染兒子卡片 (確保所有文字皆在 22px 以上)
        function renderSonsCards() {
            const grid = document.getElementById('sonsGrid');
            grid.innerHTML = '';

            const filtered = sonsData.filter(son => {
                return (currentMotherFilter === "all" || son.mother === currentMotherFilter);
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl border-2 border-dashed border-parchment-300">
                        <p class="senior-title font-bold text-gray-700 mb-2">沒有找到符合條件的兒子</p>
                        <p class="senior-text text-gray-500">請嘗試切換生母標籤</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(son => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border-2 border-parchment-300 p-5 shadow-sm hover:shadow-md hover:border-ochre-700 transition flex flex-col justify-between cursor-pointer space-y-4";
                card.onclick = () => openSonModal(son.id);

                card.innerHTML = `
                    <div class="space-y-3">
                        <!-- 卡片頂部：名字與生母 -->
                        <div class="flex items-center justify-between pb-2 border-b-2 border-parchment-100">
                            <div class="flex items-center gap-3">
                                <span class="w-10 h-10 rounded-full bg-parchment-200 text-ochre-900 font-extrabold text-xl flex items-center justify-center border border-parchment-300">
                                    ${son.id}
                                </span>
                                <h3 class="senior-title font-black text-gray-900">${son.name}</h3>
                            </div>
                            <span class="text-xl px-3.5 py-1 rounded-full border-2 font-bold ${son.motherBadge}">
                                母：${son.mother}
                            </span>
                        </div>

                        <!-- 歷史定位標籤 -->
                        <div>
                            <span class="inline-block text-xl font-bold bg-parchment-100 text-ochre-900 px-3 py-1 rounded-lg border border-parchment-300">
                                📌 ${son.role}
                            </span>
                        </div>

                        <!-- 簡介（強製字體 22px 以上） -->
                        <p class="senior-text text-gray-800 font-normal">
                            ${son.summary}
                        </p>
                    </div>

                    <!-- 底部提示區域 -->
                    <div class="pt-3 border-t-2 border-parchment-100 flex items-center justify-between text-ochre-800 font-bold senior-text">
                        <span>查看完整聖經記載 ➔</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 開啟詳細資料彈出視窗 Modal (大字體 22px+)
        function openSonModal(id) {
            const son = sonsData.find(s => s.id === id);
            if (!son) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="space-y-5">
                    <!-- Modal 標頭 -->
                    <div class="flex items-center gap-3 border-b-2 border-parchment-200 pb-3 pr-10">
                        <span class="w-12 h-12 rounded-full bg-ochre-800 text-white font-extrabold text-2xl flex items-center justify-center">
                            ${son.id}
                        </span>
                        <div>
                            <h3 class="text-3xl sm:text-4xl font-black text-gray-900">${son.name}</h3>
                            <div class="flex flex-wrap items-center gap-2 mt-1">
                                <span class="text-xl px-3 py-0.5 rounded-full border-2 font-bold ${son.motherBadge}">生母：${son.mother}</span>
                                <span class="text-xl text-gray-800 font-bold">歷史：${son.role}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 詳細內容（全數採用 senior-text 22px 大字體） -->
                    <div class="space-y-4">
                        <!-- 歷史與聖經記載全文 -->
                        <div class="bg-parchment-100 p-4 rounded-2xl border-2 border-parchment-200 space-y-2">
                            <h4 class="font-bold text-ochre-900 text-2xl flex items-center gap-1.5">
                                📖 歷史與聖經重要記載：
                            </h4>
                            <p class="senior-text text-gray-900 leading-relaxed font-normal">
                                ${son.fullDetail}
                            </p>
                        </div>

                        <!-- 臨終預言與祝福 -->
                        <div class="p-4 border-2 border-parchment-200 rounded-2xl bg-white space-y-1">
                            <h4 class="font-bold text-gray-900 text-2xl">📜 雅各臨終預言與祝福：</h4>
                            <p class="senior-text text-gray-800 leading-relaxed">
                                ${son.blessing}
                            </p>
                        </div>

                        <!-- 後代英雄 -->
                        <div class="p-4 border-2 border-parchment-200 rounded-2xl bg-white space-y-1">
                            <h4 class="font-bold text-gray-900 text-2xl">👑 歷史關鍵後代英雄：</h4>
                            <p class="senior-text text-gray-800 leading-relaxed">
                                ${son.descendants}
                            </p>
                        </div>

                        <!-- 土地分派特徵 -->
                        <div class="p-4 border-2 border-parchment-200 rounded-2xl bg-white space-y-1">
                            <h4 class="font-bold text-gray-900 text-2xl">🗺️ 迦南土地劃分與特徵：</h4>
                            <p class="senior-text text-gray-800 leading-relaxed">
                                ${son.territoryNote}
                            </p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('sonModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // 事件監聽
        function setupEventListeners() {
            // 母系篩選按鈕
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => {
                        b.classList.remove('active', 'bg-ochre-800', 'text-white', 'border-ochre-800');
                        b.classList.add('bg-parchment-100', 'text-gray-800', 'border-parchment-300');
                    });
                    btn.classList.add('active', 'bg-ochre-800', 'text-white', 'border-ochre-800');
                    btn.classList.remove('bg-parchment-100', 'text-gray-800', 'border-parchment-300');

                    currentMotherFilter = btn.getAttribute('data-mother');
                    renderSonsCards();
                });
            });

            // 關閉 Modal
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('sonModal').addEventListener('click', (e) => {
                if (e.target.id === 'sonModal') closeModal();
            });
        }

        function closeModal() {
            document.getElementById('sonModal').classList.add('hidden');
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
