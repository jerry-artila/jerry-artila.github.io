  <style>
    /* 專為長輩與手機端設計之大字體與高對比規範 */
    /* 主字級以 CSS 變數控制：預設 26px，可經由「字級放大」按鈕於 22/24/26px 間循環切換 */
    :root {
      --senior-base: 26px;
    }

    body {
      font-size: var(--senior-base);
      line-height: 1.75;
      background-color: #fdfbf7;
      color: #1a1a1a;
      -webkit-tap-highlight-color: transparent;
    }

    .senior-text {
      font-size: var(--senior-base) !important;
      line-height: 1.75 !important;
    }

    /* 標題字級隨主字級等比放大（主字級 +6px，22→28px） */
    .senior-title {
      font-size: calc(var(--senior-base) + 6px) !important;
      line-height: 1.4 !important;
    }

    /* 次標題字級隨主字級等比放大（主字級 +2px，22→24px） */
    .senior-subtitle {
      font-size: calc(var(--senior-base) + 2px) !important;
      line-height: 1.5 !important;
    }

    /* 名字快速定位錨點：捲動時預留固定頁首高度，避免卡片被遮住 */
    .son-card {
      scroll-margin-top: 130px;
    }

    /* 名字定位時的高亮閃爍提示 */
    @keyframes highlightFlash {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(194, 65, 12, 0);
      }
      25%, 70% {
        box-shadow: 0 0 0 8px rgba(194, 65, 12, 0.45);
      }
    }
    .highlight-flash {
      border-color: #c2410c !important;
      animation: highlightFlash 1.3s ease-in-out 2;
    }

    /* 回到頂部按鈕：預設隱藏，捲動後顯示 */
    #backToTop {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #backToTop.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* 客製化捲軸 */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f7f2e7;
    }

    ::-webkit-scrollbar-thumb {
      background: #9a3412;
      border-radius: 4px;
    }
  </style>
</head>
<!-- Chosen Palette: Warm Senior-Friendly Parchment & Deep Ochre (溫暖羊皮紙與赭紅高對比主題) -->
<!-- Application Structure Plan:
     本應用程式依需求精簡，專注於「十二子互動檔案庫」單一核心模組：
     - 手機優先 (Mobile-First) 設計：採用卡片式垂直堆疊與流暢單/雙欄版面，徹底避免橫向滾動。
     - 大字體閱讀體驗：卡片摘要、分類標籤、詳細內容及彈出對話盒（Modal）全數設定為 22px 以上大字體。
     - 高友善互動：具備大觸控範圍按鈕（高度至少 48px）與生母標籤篩選，點擊卡片即可展開完整歷史記載。
-->
<!-- Visualization & Content Choices:
     - 界面佈局：採用純 HTML/CSS (Tailwind) 高對比卡片網格與全螢幕大對話盒。
     - 視覺元素：全數使用 Unicode 圖示（如 📜, , 📖, 👑, 🗺️），不使用任何 SVG 圖形與外部圖表庫。
     - 內容收錄：完全依據原始整理資料，涵蓋 12 位兒子的出生序、生母、歷史定位、長度擴充之聖經記載、臨終預言與關鍵後代英雄。
     Confirming: NO SVG graphics used, NO Mermaid JS used.
-->
<!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    let currentMotherFilter = "all";

    // ---- 字級控制：22 / 24 / 26px 循環切換，預設 26px ----
    const FONT_SIZES = [22, 24, 26];
    let fontIndex = 2; // 預設指向 26px

    function setBaseFont(px) {
      // 透過 CSS 變數讓全文（body / senior-text / senior-title / senior-subtitle）等比放大
      document.documentElement.style.setProperty('--senior-base', px + 'px');
      const label = document.getElementById('fontSizeLabel');
      if (label) label.textContent = px;
      const btn = document.getElementById('fontSizeBtn');
      if (btn) btn.setAttribute('aria-label', `切換字級大小，目前 ${px}px`);
    }

    function initFontControl() {
      // 嘗試讀取先前記憶的字級，否則使用預設 26px
      let saved = null;
      try {
        const raw = localStorage.getItem('jacob12sons.fontSize');
        saved = raw ? parseInt(raw, 10) : null;
      } catch (e) { /* localStorage 不可用時忽略 */ }

      const px = (saved !== null && FONT_SIZES.includes(saved)) ? saved : 26;
      fontIndex = FONT_SIZES.indexOf(px);
      setBaseFont(px);

      document.getElementById('fontSizeBtn').addEventListener('click', () => {
        fontIndex = (fontIndex + 1) % FONT_SIZES.length; // 22 → 24 → 26 → 22 循環
        const next = FONT_SIZES[fontIndex];
        setBaseFont(next);
        try { localStorage.setItem('jacob12sons.fontSize', String(next)); } catch (e) { /* ignore */ }
      });
    }

    // ---- 回到頂部按鈕 ----
    function initBackToTop() {
      const btn = document.getElementById('backToTop');
      if (!btn) return;

      // 捲動超過 400px 才顯示
      const onScroll = () => {
        btn.classList.toggle('is-visible', window.scrollY > 400);
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // 初始化
    document.addEventListener("DOMContentLoaded", () => {
      initFontControl();
      renderSonsCards();
      renderNameNav();
      initBackToTop();
      setupEventListeners();
    });

    // 渲染兒子卡片 (確保所有文字皆在 22px 以上)
    function renderSonsCards() {
      const grid = document.getElementById('sonsGrid');
      grid.innerHTML = '';

      const filtered = sonsData.filter(son => {
        return (currentMotherFilter === "all" || son.mother === currentMotherFilter);
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl border-2 border-dashed border-parchment-300">
                        <p class="senior-title font-bold text-gray-700 mb-2">沒有找到符合條件的兒子</p>
                        <p class="senior-text text-gray-500">請嘗試切換生母標籤</p>
                    </div>
                `;
        return;
      }

      filtered.forEach(son => {
        const card = document.createElement('div');
        card.id = 'son-card-' + son.id;
        card.className = "son-card bg-white rounded-2xl border-2 border-parchment-300 p-5 shadow-sm hover:shadow-md hover:border-ochre-700 transition flex flex-col justify-between cursor-pointer space-y-4";
        card.onclick = () => openSonModal(son.id);

        card.innerHTML = `
                    <div class="space-y-3">
                        <!-- 卡片頂部：名字與生母 -->
                        <div class="flex items-center justify-between pb-2 border-b-2 border-parchment-100">
                            <div class="flex items-center gap-3">
                                <span class="w-10 h-10 rounded-full bg-parchment-200 text-ochre-900 font-extrabold text-xl flex items-center justify-center border border-parchment-300">
                                    ${son.id}
                                </span>
                                <h3 class="senior-title font-black text-gray-900">${son.name}</h3>
                            </div>
                            <span class="text-xl px-3.5 py-1 rounded-full border-2 font-bold ${son.motherBadge}">
                                母：${son.mother}
                            </span>
                        </div>

                        <!-- 歷史定位標籤 -->
                        <div>
                            <span class="inline-block text-xl font-bold bg-parchment-100 text-ochre-900 px-3 py-1 rounded-lg border border-parchment-300">
                                📌 ${son.role}
                            </span>
                        </div>

                        <!-- 簡介（強製字體 22px 以上） -->
                        <p class="senior-text text-gray-800 font-normal">
                            ${son.summary}
                        </p>
                    </div>

                    <!-- 底部提示區域 -->
                    <div class="pt-3 border-t-2 border-parchment-100 flex items-center justify-between text-ochre-800 font-bold senior-text">
                        <span>查看完整聖經記載 ➔</span>
                    </div>
                `;
        grid.appendChild(card);
      });
    }

    // 開啟詳細資料彈出視窗 Modal (大字體 22px+)
    function openSonModal(id) {
      const son = sonsData.find(s => s.id === id);
      if (!son) return;

      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
                <div class="space-y-5">
                    <!-- Modal 標頭 -->
                    <div class="flex items-center gap-3 border-b-2 border-parchment-200 pb-3 pr-10">
                        <span class="w-12 h-12 rounded-full bg-ochre-800 text-white font-extrabold text-2xl flex items-center justify-center">
                            ${son.id}
                        </span>
                        <div>
                            <h3 class="text-3xl sm:text-4xl font-black text-gray-900">${son.name}</h3>
                            <div class="flex flex-wrap items-center gap-2 mt-1">
                                <span class="text-xl px-3 py-0.5 rounded-full border-2 font-bold ${son.motherBadge}">生母：${son.mother}</span>
                                <span class="text-xl text-gray-800 font-bold">歷史：${son.role}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 詳細內容（全數採用 senior-text 22px 大字體） -->
                    <div class="space-y-4">
                        <!-- 歷史與聖經記載全文 -->
                        <div class="bg-parchment-100 p-4 rounded-2xl border-2 border-parchment-200 space-y-2">
                            <h4 class="font-bold text-ochre-900 text-2xl flex items-center gap-1.5">
                                📖 歷史與聖經重要記載：
                            </h4>
                            <p class="senior-text text-gray-900 leading-relaxed font-normal">
                                ${son.fullDetail}
                            </p>
                        </div>

                        <!-- 臨終預言與祝福 -->
                        <div class="p-4 border-2 border-parchment-200 rounded-2xl bg-white space-y-1">
                            <h4 class="font-bold text-gray-900 text-2xl">📜 雅各臨終預言與祝福：</h4>
                            <p class="senior-text text-gray-800 leading-relaxed">
                                ${son.blessing}
                            </p>
                        </div>

                        <!-- 後代英雄 -->
                        <div class="p-4 border-2 border-parchment-200 rounded-2xl bg-white space-y-1">
                            <h4 class="font-bold text-gray-900 text-2xl">👑 歷史關鍵後代英雄：</h4>
                            <p class="senior-text text-gray-800 leading-relaxed">
                                ${son.descendants}
                            </p>
                        </div>

                        <!-- 土地分派特徵 -->
                        <div class="p-4 border-2 border-parchment-200 rounded-2xl bg-white space-y-1">
                            <h4 class="font-bold text-gray-900 text-2xl">🗺️ 迦南土地劃分與特徵：</h4>
                            <p class="senior-text text-gray-800 leading-relaxed">
                                ${son.territoryNote}
                            </p>
                        </div>
                    </div>
                </div>
            `;

      document.getElementById('sonModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    // ---- 名字快速定位：點名字平滑捲動到對應卡片並高亮 ----
    // 統一處理「依生母篩選」：同步按鈕外觀並重新渲染卡片
    function applyMotherFilter(mother) {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active', 'bg-ochre-800', 'text-white', 'border-ochre-800');
        b.classList.add('bg-parchment-100', 'text-gray-800', 'border-parchment-300');
      });
      const active = document.querySelector(`.filter-btn[data-mother="${CSS.escape(mother)}"]`);
      if (active) {
        active.classList.add('active', 'bg-ochre-800', 'text-white', 'border-ochre-800');
        active.classList.remove('bg-parchment-100', 'text-gray-800', 'border-parchment-300');
      }
      currentMotherFilter = mother;
      renderSonsCards();
    }

    // 於篩選區生成 12 位兒子的名字按鈕
    function renderNameNav() {
      const nav = document.getElementById('nameNav');
      if (!nav) return;
      nav.innerHTML = '';
      sonsData.forEach(son => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.id = son.id;
        btn.setAttribute('aria-label', `定位到${son.name}的內容`);
        btn.className = "name-nav-btn min-h-[48px] px-4 py-2 rounded-xl text-xl font-bold transition border-2 border-parchment-300 bg-parchment-100 text-gray-800 hover:bg-ochre-800 hover:text-white active:scale-95";
        btn.textContent = son.name;
        btn.addEventListener('click', () => jumpToSon(son.id));
        nav.appendChild(btn);
      });
    }

    // 依名字定位：先確保卡片顯示（切回「全部」），再平滑捲動並短暫高亮
    function jumpToSon(id) {
      if (currentMotherFilter !== 'all') applyMotherFilter('all');

      const target = document.getElementById('son-card-' + id);
      if (!target) return;

      target.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // 重啟高亮動畫（連續點擊不同名字也能重新閃爍）
      target.classList.remove('highlight-flash');
      void target.offsetWidth;
      target.classList.add('highlight-flash');
      clearTimeout(target._flashTimer);
      target._flashTimer = setTimeout(() => target.classList.remove('highlight-flash'), 2600);
    }

    // 事件監聽
    function setupEventListeners() {
      // 母系篩選按鈕
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          applyMotherFilter(btn.getAttribute('data-mother'));
        });
      });

      // 關閉 Modal
      document.getElementById('closeModal').addEventListener('click', closeModal);
      document.getElementById('backFromModal').addEventListener('click', closeModal);
      document.getElementById('sonModal').addEventListener('click', (e) => {
        if (e.target.id === 'sonModal') closeModal();
      });
    }

    function closeModal() {
      document.getElementById('sonModal').classList.add('hidden');
      document.body.style.overflow = '';
    }
  </script>
